<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0069b4"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Sanitation Report – Commercial Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0e1c33;--mute:#5b6784;--line:#d5dbea;--navy:#0069b4;--red:#ef3e48;--sky:#dbe8f7;--ok:#1c7c4d;--yes:#ef3e48;--no:#0069b4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--card:#182038;--ink:#eef1fa;--mute:#9aa6c6;--line:#2c3758;--navy:#4da3e8;--red:#ff6670;--sky:#222c4d;--ok:#5fd39a;--yes:#ff6670;--no:#4da3e8}}
:root[data-theme="dark"]{--bg:#0f1526;--card:#182038;--ink:#eef1fa;--mute:#9aa6c6;--line:#2c3758;--navy:#4da3e8;--red:#ff6670;--sky:#222c4d;--ok:#5fd39a;--yes:#ff6670;--no:#4da3e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;align-items:center;gap:12px;padding:14px;margin:-12px -14px 16px;background:linear-gradient(135deg,var(--navy),#0a4f8a);color:#fff;border-bottom:5px solid var(--red)}
.mark{height:46px;width:auto;flex:none;background:#fff;border-radius:6px;padding:2px 4px}
h1{font-size:19px;font-weight:800;margin:0;line-height:1.15}
header p{margin:2px 0 0;color:#dbe8f7;font-size:13px}
#status{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:10px;padding:9px 12px;font-size:14px;background:var(--sky);margin-bottom:14px}
#status.off{background:var(--red);color:#fff}
#status button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:6px 10px;background:var(--navy);color:#fff}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;border-top:4px solid var(--navy)}
h2{font-size:16px;font-weight:800;margin:0 0 10px;color:var(--navy)}section:nth-of-type(even){border-top-color:var(--red)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--navy);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid .full{grid-column:1/-1}
.q{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q span{flex:1;font-size:15px}
.seg{display:flex;flex:none;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-weight:600;font-size:14px;min-width:56px;min-height:42px;border:0;background:transparent;color:var(--mute)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on.y{background:var(--yes);color:#fff}
.seg button.on.n{background:var(--no);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:7px;margin:0;padding:9px 13px;border:1.5px solid var(--line);border-radius:999px;color:var(--ink);font-size:15px}
.chips input{width:auto;margin:0}
.chips label:has(input:checked){background:var(--sky);border-color:var(--navy)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bar>div{max-width:760px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:800;border:0;border-radius:11px;padding:13px 16px;background:var(--navy);color:#fff;flex:1}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:none}
.btn.red{background:var(--red);color:#fff}
#report{display:none}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:16px;font-size:13px;overflow-x:auto}
.paper .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px}
.paper h3{text-align:center;font-size:16px;margin:12px 0 8px}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:3px 4px;border-bottom:1px solid #e4e7ef;vertical-align:top}
.paper .box{border:1.5px solid #111;border-radius:10px;padding:6px 10px;margin-bottom:10px}
.paper .box div{padding:3px 0;border-bottom:1px solid #ccc}
.paper .box div:last-child{border:0}
.paper{border-top:6px solid #ef3e48}.paper h3{color:#0069b4}.paper h4{text-align:center;margin:12px 0 4px;font-size:14px;background:#0069b4;color:#fff;padding:5px;border-radius:6px}
.flag{font-weight:800;color:#ef3e48}
.hist{font-size:14px;color:var(--mute)}
.hist b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;display:none}
@media print{body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;width:100%;border:0}}
.th{position:relative;width:84px;height:84px}.th img{width:100%;height:100%;object-fit:cover;border-radius:9px}.th button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:16px}#thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.pick{display:block;text-align:center;padding:13px;border:1.5px dashed var(--navy);border-radius:11px;color:var(--navy);font-weight:600;margin:0}.pick input{display:none}.paper .ph{display:flex;flex-wrap:wrap;gap:6px}.paper .ph img{width:31%;border-radius:4px}.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end}.sheet.open{display:flex}.sheet>div{background:var(--card);width:100%;max-width:760px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}.sheet small{color:var(--mute)}.paper .top{align-items:center}.paper .co{text-align:right;font-size:15px;line-height:28px}.paper .box div{padding:7px 0}.paper .box small{display:block;color:#6b7280;font-size:11px;line-height:1.2}.paper .box b{font-size:16px}.paper .r3{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.paper .r3 span{flex:1 1 30%;min-width:110px}</style>
</head>

let CLIENTS=[];
const INSIDE=["Food & debris spilled on floor","Food & debris under equipment","Dirty food preparation surfaces","Floor drains open or dirty","Food carts dirty","Opening around pipes/utility lines","Water problems","Un-caulked cracks & crevices","Broken tiles/damaged walls","Excessive grease","Boxes stored directly on floor","Damaged boxes or packaging","Excessive clutter","Inadequate inspection lanes","Food stored in open containers","Outdated merchandise","Dirty garbage containers","Damaged screens/windows","Pests observed","Rodent droppings","Food & debris in dishwasher","Mops & buckets sour","Leaky/overflowing grease traps","Dining area/salad bar un-sanitary","Leaky beverage dispensers","Dirty rest rooms/locker rooms","Vending machine spillage","Trash containers inadequate"];
const OUTSIDE=["Opening around pipes/utility lines","Dumpsters inadequate/dirty","Weeds or other pest harborage","Inadequate rodent proofing","Damaged screens/windows","Loading dock spillage/clutter","Bird roosting/feeding activity","Rodent droppings/gnawing etc."];
const PESTS=["Cockroaches","Rats","Mice","Flies","Ants","Stored product pests"];
const $=id=>document.getElementById(id);
const ans={in:{},out:{}};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let queue=store.get("bpc_queue",[]),sent=store.get("bpc_sent",[]);

function rows(list,key,el){
 $(el).innerHTML=list.map((t,i)=>`<div class="q"><span>${t}</span><div class="seg" role="group" aria-label="${t}"><button type="button" class="y" data-k="${key}" data-i="${i}" data-v="Y">Yes</button><button type="button" class="n" data-k="${key}" data-i="${i}" data-v="N">No</button></div></div>`).join("");
}
rows(INSIDE,"in","inside");rows(OUTSIDE,"out","outside");
$("pests").innerHTML=PESTS.map(p=>`<label><input type="checkbox" value="${p}">${p}</label>`).join("");
function fillClients(sel){CLIENTS.sort((a,b)=>a.name.localeCompare(b.name));$("client").innerHTML='<option value="">New client (type details below)</option>'+CLIENTS.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join("");if(sel!=null&&sel>=0)$("client").value=sel;$("cnt").textContent=CLIENTS.length?CLIENTS.length+" saved on this phone":"No saved clients yet"}
$("date").value=new Date().toISOString().slice(0,10);

document.addEventListener("click",e=>{
 const b=e.target.closest(".seg button");if(!b)return;
 const {k,i,v}=b.dataset;
 ans[k][i]=ans[k][i]===v?undefined:v;
 b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",ans[k][i]===x.dataset.v));
});
$("client").onchange=e=>{
 const c=CLIENTS[e.target.value]||{};
 f_name.value=c.name||"";f_addr.value=c.addr||"";f_contact.value=c.contact||"";f_email.value=c.email||"";f_phone.value=c.phone||"";
};

const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function collect(){
 return {id:Date.now(),facility:f_name.value,addr:f_addr.value,contact:f_contact.value,email:f_email.value,phone:f_phone.value,
 inside:INSIDE.map((t,i)=>[t,ans.in[i]||""]),outside:OUTSIDE.map((t,i)=>[t,ans.out[i]||""]),
 inOther:inOther.value,outOther:outOther.value,
 pests:[...document.querySelectorAll("#pests input:checked")].map(x=>x.value),pestOther:pestOther.value,
 recs:recs.value,inspector:inspector.value,date:date.value};
}
function mark(v){return v==="Y"?'<span class="flag">YES</span>':v==="N"?"NO":'<span style="color:#999">–</span>'}
function list(a){return `<table>${a.map(r=>`<tr><td>${esc(r[0])}</td><td style="width:42px;text-align:right">${mark(r[1])}</td></tr>`).join("")}</table>`}
function paper(r){
 return `<div class="top"><img src="${LOGO}" style="height:84px" alt="Bermuda Pest Control"><div class="co">P.O. Box WK 510 • Warwick, WK BX, Bermuda<br>Telephone: (441) 236-1823<br>Email: ${TO}</div></div>
 <h3>Pest Control Sanitation Report – Commercial Kitchen</h3>
 <div class="box"><div><small>Name of Facility</small><b>${esc(r.facility)}</b></div><div><small>Street Address</small><b>${esc(r.addr)}</b></div><div class="r3"><span><small>Contact Name</small><b>${esc(r.contact)}</b></span><span><small>Email</small><b>${esc(r.email)}</b></span><span><small>Phone</small><b>${esc(r.phone)}</b></span></div></div>
 <h4>Problems inside – food storage, preparation &amp; serving</h4>${list(r.inside)}
 <p>Other problems: ${esc(r.inOther)||"–"}</p>
 <h4>Problems outside</h4>${list(r.outside)}
 <p>Other problems: ${esc(r.outOther)||"–"}</p>
 <p><b>Pests observed:</b> ${r.pests.length?r.pests.map(esc).join(", "):"None"}${r.pestOther?" · Other: "+esc(r.pestOther):""}</p>
 <p><b>Recommendations:</b><br>${esc(r.recs).replace(/\n/g,"<br>")||"–"}</p>
 ${photos.length?`<p><b>Photos (${photos.length}):</b></p><div class="ph">${photos.map(x=>`<img src="${x.url}">`).join("")}</div>`:""}
 <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;font-size:18px"><span><b>Technician:</b> ${esc(r.inspector)}</span><span><b>Date:</b> ${esc(r.date)}</span></div>`;
}
let current=null;
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function setActions(mode){
 $("actions").innerHTML=mode==="form"
 ?'<button class="btn" id="build">Compile report</button>'
 :'<button class="btn alt" id="back">Edit</button><button class="btn red" id="queueBtn">Send / share</button>';
 if(mode==="form")$("build").onclick=build;
 else{$("back").onclick=()=>show("form");$("queueBtn").onclick=()=>$("sheet").classList.add("open")}
}
function show(m){$("form").style.display=m==="form"?"block":"none";$("report").style.display=m==="form"?"none":"block";setActions(m);scrollTo(0,0)}
function build(){
 if(!f_name.value.trim()){toast("Enter the facility name");f_name.focus();return}
 if(!inspector.value){toast("Enter the technician name");inspector.focus();return}
 saveClient();current=collect();$("paper").innerHTML=paper(current);show("report");
}
const photos=[];
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res({url:c.toDataURL("image/jpeg",.8),w:c.width,h:c.height})};im.src=u})}
function thumbs(){$("thumbs").innerHTML=photos.map((p,i)=>`<div class="th"><img src="${p.url}" alt="Photo ${i+1}"><button type="button" data-rm="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join("")}
$("photoIn").onchange=async e=>{for(const f of e.target.files)photos.push(await shrink(f));e.target.value="";thumbs()};
$("thumbs").onclick=e=>{const b=e.target.closest("[data-rm]");if(b){photos.splice(+b.dataset.rm,1);thumbs()}};
function makePdf(r){
 const d=new window.jspdf.jsPDF({unit:"pt",format:"letter"}),W=612;
 d.setFillColor(239,62,72).rect(0,0,W,10,"F");d.setFillColor(0,105,180).rect(0,10,W,4,"F");d.addImage(LOGO,"JPEG",36,20,216,75);
 d.setFont("helvetica","normal").setFontSize(9);
 d.setFontSize(14.5);["P.O. Box WK 510, Warwick, WK BX, Bermuda","Telephone: (441) 236-1823","Email: "+TO].forEach((t,i)=>d.text(t,W-36,40+i*25,{align:"right"}));d.setFontSize(9);
 d.setTextColor(0,105,180).setFont("helvetica","bold").setFontSize(14).text("Pest Control Sanitation Report - Commercial Kitchen",W/2,104,{align:"center"});d.setTextColor(0);
 d.setDrawColor(0,105,180).setLineWidth(1.5).roundedRect(36,114,W-72,84,8,8);d.setLineWidth(.6).setDrawColor(200);d.line(46,145,W-46,145);d.line(46,171,W-46,171);d.setDrawColor(0);
 const fld=(l,v,x,y,w)=>{d.setTextColor(110).setFont("helvetica","normal").setFontSize(8).text(l,x,y);d.setTextColor(0).setFont("helvetica","bold").setFontSize(11.5).text(v||"",x,y+12,{maxWidth:w})};
 fld("Name of Facility",r.facility,46,127,520);fld("Street Address",r.addr,46,153,520);fld("Contact Name",r.contact,46,179,170);fld("Email",r.email,230,179,200);fld("Phone",r.phone,448,179,120);
 d.setTextColor(0).setFont("helvetica","normal").setFontSize(8.5);
 const head=(t,y)=>{d.setFillColor(0,105,180).roundedRect(36,y-12,W-72,18,4,4,"F");d.setTextColor(255).setFont("helvetica","bold").setFontSize(11).text(t,W/2,y,{align:"center"});d.setTextColor(0);d.setFont("helvetica","normal").setFontSize(8.5)};
 const col=(a,x,y)=>a.forEach((q,i)=>{d.setTextColor(0);d.text(q[0],x,y+i*14);d.setTextColor(q[1]==="Y"?200:0,0,q[1]==="Y"?30:0);d.text(q[1]==="Y"?"YES":q[1]==="N"?"NO":"-",x+240,y+i*14);d.setTextColor(0)});
 head("Problems Inside - Food Storage, Preparation & Serving",222);col(r.inside.slice(0,14),36,240);col(r.inside.slice(14),316,240);
 let y=452;d.text("Other problems: "+(r.inOther||""),36,y,{maxWidth:540});
 head("Problems Outside",478);col(r.outside.slice(0,4),36,496);col(r.outside.slice(4),316,496);
 d.text("Other problems: "+(r.outOther||""),36,564,{maxWidth:540});
 d.setFont("helvetica","bold").text("Pests observed: ",36,584);d.setFont("helvetica","normal").text((r.pests.join(", ")||"None")+(r.pestOther?"; Other: "+r.pestOther:""),110,584,{maxWidth:470});
 d.setFont("helvetica","bold").text("Recommendations:",36,604);d.setFont("helvetica","normal").text(r.recs||"",36,618,{maxWidth:540});
 d.setFontSize(13).setFont("helvetica","bold").text("Technician:",36,732);d.setFont("helvetica","normal").text(r.inspector||"",112,732);d.setFont("helvetica","bold").text("Date:",400,732);d.setFont("helvetica","normal").text(r.date||"",438,732);d.setDrawColor(0,105,180).setLineWidth(1).line(112,736,360,736).line(438,736,W-36,736);d.setDrawColor(0).setLineWidth(.6);d.setFontSize(8.5);
 photos.forEach(p=>{d.addPage();const k=Math.min(540/p.w,680/p.h);d.addImage(p.url,"JPEG",36,36,p.w*k,p.h*k)});
 return d;
}
const fname=r=>("Sanitation_"+r.facility.replace(/[^\w]+/g,"_")+"_"+r.date).slice(0,80);
async function pack(){
 const r=current,b=fname(r),d=makePdf(r),z=new JSZip();
 const pdf=new File([d.output("blob")],b+".pdf",{type:"application/pdf"});
 z.file(b+".pdf",pdf);photos.forEach((p,i)=>z.file("photos/photo-"+(i+1)+".jpg",p.url.split(",")[1],{base64:true}));
 return {pdf,zip:new File([await z.generateAsync({type:"blob"})],b+".zip",{type:"application/zip"})};
}
async function share(f){
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Sanitation report - "+current.facility});return}}catch(e){if(e&&e.name==="AbortError")return}
 await save(f);
}
async function save(f){
 try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:f.name,data:f});toast("Saved "+f.name);return}}catch(e){if(e&&e.code==="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
}
const run=fn=>async()=>{try{toast("Preparing file…");const f=await pack();await fn(f)}catch(e){toast("Could not create the file")}};
$("shZip").onclick=run(f=>share(f.zip));$("shPdf").onclick=run(f=>share(f.pdf));$("dlZip").onclick=run(f=>save(f.zip));
$("shX").onclick=()=>$("sheet").classList.remove("open");
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("open")};
$("sz").textContent="Photos are compressed. Choose WhatsApp or Mail in the share menu.";
setActions("form");
function saveClient(){const c={name:f_name.value.trim(),addr:f_addr.value,contact:f_contact.value,email:f_email.value,phone:f_phone.value};if(!c.name)return;const k=CLIENTS.findIndex(x=>x.name.toLowerCase()===c.name.toLowerCase());if(k<0)CLIENTS.push(c);else CLIENTS[k]=c;store.set("bpc_clients",CLIENTS);fillClients(CLIENTS.findIndex(x=>x.name===c.name));if(k<0)toast("Client saved for next time")}
function mlist(){$("mlist").innerHTML=CLIENTS.length?CLIENTS.map((c,i)=>`<div class="q"><span>${esc(c.name)}</span><button type="button" class="btn alt" data-del="${i}" style="padding:6px 12px;font-size:14px">Delete</button></div>`).join(""):'<p class="hist">No saved clients yet.</p>'}
$("mOpen").onclick=()=>{mlist();$("mgr").classList.add("open")};
$("mX").onclick=()=>$("mgr").classList.remove("open");
$("mgr").onclick=e=>{if(e.target.id==="mgr")$("mgr").classList.remove("open");const b=e.target.closest("[data-del]");if(!b)return;if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Tap again";return}CLIENTS.splice(+b.dataset.del,1);store.set("bpc_clients",CLIENTS);fillClients();mlist()};
$("mExp").onclick=()=>{if(!CLIENTS.length){toast("Nothing to export yet");return}share(new File([JSON.stringify(CLIENTS,null,1)],"BPC_clients.json",{type:"application/json"}))};
$("mImp").onchange=async e=>{try{const a=JSON.parse(await e.target.files[0].text());let n=0;a.forEach(c=>{if(c&&c.name&&!CLIENTS.some(x=>x.name.toLowerCase()===c.name.toLowerCase())){CLIENTS.push({name:c.name,addr:c.addr||"",contact:c.contact||"",email:c.email||"",phone:c.phone||""});n++}});store.set("bpc_clients",CLIENTS);fillClients();mlist();toast(n+" clients added")}catch(x){toast("That is not a client list file")}e.target.value=""};
CLIENTS=store.get("bpc_clients",[]);fillClients();
</script>
